<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - 福建美术与设计类志愿填报助手</title>
  <style>
    :root { --ink:#172026; --muted:#63707c; --line:#dbe3ea; --brand:#1f5f8f; --red:#b8413b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:#f3f6f5; font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; letter-spacing:0; }
    main { width:min(100%, 420px); background:#fff; border:1px solid var(--line); border-radius:8px; padding:28px; box-shadow:0 14px 38px rgba(23,32,38,.08); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
    .mark { width:42px; height:42px; display:grid; place-items:center; background:var(--brand); color:#fff; border-radius:6px; font-weight:800; }
    h1 { margin:0; font-size:21px; line-height:1.35; }
    p { margin:7px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    label { display:block; margin:17px 0 7px; font-size:14px; font-weight:700; }
    input { width:100%; height:44px; padding:0 12px; border:1px solid #bdc9d2; border-radius:6px; font:inherit; }
    input:focus { outline:3px solid rgba(31,95,143,.16); border-color:var(--brand); }
    button { width:100%; height:44px; margin-top:22px; border:0; border-radius:6px; background:var(--brand); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { min-height:23px; margin-top:13px; font-size:14px; color:var(--muted); }
    #status.error { color:var(--red); }
    .setup { padding:12px; border:1px solid #e5c47b; background:#fff8e7; border-radius:6px; color:#745018; line-height:1.6; }
    .help-link { min-height:42px; display:flex; align-items:center; justify-content:center; gap:7px; margin-top:8px; border:1px solid #91b3c8; border-radius:6px; color:var(--brand); background:#edf5f8; text-align:center; text-decoration:none; font-size:14px; font-weight:800; }
    .help-link::before { content:"?"; width:19px; height:19px; display:grid; place-items:center; border-radius:50%; color:#fff; background:var(--brand); font-size:12px; font-weight:900; }
    .help-link:hover { background:#e1eef3; }
    .help-link.risk { border-color:#d29b96; color:#96322d; background:#fff2f0; }
    .help-link.risk::before { content:"!"; background:#a93731; }
    .help-link.risk:hover { background:#fbe5e2; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">艺</div>
      <div>
        <h1>账号登录</h1>
        <p>福建美术与设计类志愿填报助手</p>
      </div>
    </div>
    <div id="setupNotice" class="setup" hidden>Supabase 尚未配置或授权开关未启用。请先完成 <code>SUPABASE_SETUP.md</code> 中的设置。</div>
    <form id="loginForm">
      <label for="email">账号邮箱</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="submitBtn" type="submit">登录</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <a class="help-link" href="./help.html">&#20808;&#30475;&#20351;&#29992;&#35828;&#26126;</a>
    <a class="help-link risk" href="./risk-notice.html">风险提示</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const setupNotice = document.getElementById("setupNotice");

    function safeNextUrl() {
      const requested = new URLSearchParams(location.search).get("next");
      if (!requested) return "./index.html";
      try {
        const target = new URL(requested, location.href);
        if (location.protocol === "file:" || target.origin === location.origin) return target.href;
      } catch (error) {
        return "./index.html";
      }
      return "./index.html";
    }

    async function initialize() {
      const ready = FujianArtAuth.isEnabled() && FujianArtAuth.isConfigured();
      setupNotice.hidden = ready;
      form.hidden = !ready;
      if (!ready) return;
      try {
        const authorization = await FujianArtAuth.getAuthorization();
        if (authorization.ok && !authorization.bypass) location.replace(safeNextUrl());
      } catch (error) {
        status.textContent = "暂时无法连接授权服务，请稍后重试。";
        status.className = "error";
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      status.className = "";
      status.textContent = "正在验证账号...";
      try {
        await FujianArtAuth.signIn(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        const authorization = await FujianArtAuth.getAuthorization();
        if (!authorization.ok) throw new Error(authorization.reason === "expired" ? "账号授权已到期" : "账号尚未获得使用授权");
        location.replace(safeNextUrl());
      } catch (error) {
        status.textContent = error.message || "账号或密码不正确";
        status.className = "error";
        submitBtn.disabled = false;
      }
    });

    initialize();
  </script>
</body>
</html>
